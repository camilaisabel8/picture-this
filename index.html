
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>

    <!-- I used srcset to give the browser different
    image resolutions to choose from, depending on
    the pixel density of the screen. -->

    <img
      src="images/museum-ls-320x.jpg"
      alt="Interior of a museum"
      srcset="images/museum-ls-320x.jpg 1x,
              images/museum-ls-640x.jpg 2x,
              images/museum-ls-960x.jpg 3x">

  </header>
</body>

</html>
