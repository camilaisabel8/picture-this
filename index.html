<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>

    
<!-- I used picture to change the image depending on the screen size.
I also used srcset with 1x, 2x and 3x to give the browser
different resolutions to choose from. -->

<picture>

  <!-- For screens 1600px and bigger, I used square images. -->
  <source media="(min-width: 1600px)"
    srcset="images/museum-square-800x.jpg 1x,
            images/museum-square-1600x.jpg 2x,
            images/museum-square-2400x.jpg 3x">

  <!-- For screens 1280px and bigger, I used smaller square images. -->
  <source media="(min-width: 1280px)"
    srcset="images/museum-square-640x.jpg 1x,
            images/museum-square-1280x.jpg 2x,
            images/museum-square-1920x.jpg 3x">

  <!-- At 960px the square image takes half of the viewport. -->
  <source media="(min-width: 960px)"
    srcset="images/museum-square-480x.jpg 1x,
            images/museum-square-960x.jpg 2x,
            images/museum-square-1440x.jpg 3x">

  <!-- Under 960px, the image changes to landscape. -->
  <source media="(min-width: 720px)"
    srcset="images/museum-ls-720x.jpg 1x,
            images/museum-ls-1440x.jpg 2x,
            images/museum-ls-2160x.jpg 3x">

  <source media="(min-width: 480px)"
    srcset="images/museum-ls-480x.jpg 1x,
            images/museum-ls-960x.jpg 2x,
            images/museum-ls-1440x.jpg 3x">

  <source media="(min-width: 320px)"
    srcset="images/museum-ls-320x.jpg 1x,
            images/museum-ls-640x.jpg 2x,
            images/museum-ls-960x.jpg 3x">

  <!-- This is the fallback image if none of the sources match. -->
  <img src="images/museum-ls-320x.jpg"
       alt="Interior of a museum">

</picture>

  </header>
</body>

</html>
